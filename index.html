<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel's Commander Deck Builder</title>
<style>
:root{--bg:#f6f4ef;--surface:#fff;--ink:#1d1b17;--muted:#6f6a5f;--line:#e2ded3;--accent:#8a5a14;--hover:#f1ede2;
--common:#6f6a5f;--uncommon:#4a7a96;--rare:#b08a1e;--mythic:#c2501a;--warn:#a4481c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--surface:#1c1b18;--ink:#ece8dd;--muted:#9d978a;--line:#2e2c27;--accent:#e0b060;--hover:#26241f;
--common:#a8a396;--uncommon:#7fb3d1;--rare:#e0c04a;--mythic:#ee7a45;--warn:#f0956a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--surface:#1c1b18;--ink:#ece8dd;--muted:#9d978a;--line:#2e2c27;--accent:#e0b060;--hover:#26241f;
--common:#a8a396;--uncommon:#7fb3d1;--rare:#e0c04a;--mythic:#ee7a45;--warn:#f0956a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 56px}
.wrap{max-width:1200px;margin:0 auto}
header{padding:28px 0 12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
h1{font:600 30px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
h2,h3{font-family:Georgia,serif;margin:0}
.sub,.msn{color:var(--muted);font-size:13px}.sub{margin-top:6px}
input,select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:5px 12px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:var(--bg)}
.sbar{position:relative;margin:8px 0}
#q{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
.sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:60vh;overflow:auto;margin-top:4px}
.sug[hidden]{display:none}
.sug button{display:flex;gap:10px;align-items:baseline;width:100%;border:0;border-radius:0;border-bottom:1px solid var(--line);text-align:left;background:none}
.sug button:hover{background:var(--hover)}
.sug span{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.cmd{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.imgs{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.imgs img{width:244px;height:auto;aspect-ratio:488/680;border-radius:12px;border:1px solid #e8e4d8;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.info{flex:1 1 320px}
.info p{margin:8px 0}
.sym{width:17px;height:17px;vertical-align:-3px}.sep{margin:0 4px;color:var(--muted)}
.tgs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tgl{border-radius:99px;padding:4px 13px;font-size:13px}
.tgl.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;margin-top:12px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font:600 22px/1.1 Georgia,serif}
.stat span,.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.curve{display:flex;gap:8px;align-items:flex-end;height:112px;margin-top:6px}
.curve .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;max-width:44px}
.bar{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.warnbox{border-color:var(--warn);color:var(--warn)}
summary{cursor:pointer}summary h3{display:inline}
.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:680px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.c,th.c{text-align:center}td.r,th.r{text-align:right;white-space:nowrap}
tbody tr:hover td{background:var(--hover)}tbody tr:last-child td{border-bottom:0}
.chip{display:inline-block;border:1px solid currentColor;color:var(--muted);border-radius:99px;padding:0 8px;font-size:12px;margin:1px 3px 1px 0}
.ramp{color:#3f9a55}.draw{color:#4a8ec2}.removal{color:#d0583f}.wipe{color:#c2501a}.syn{color:var(--rare)}.stp{color:#9a6bd0}.warn{color:var(--warn)}.tutor{color:#5aa7a0}.protect{color:#7f8fb8}.recur{color:#a06a8a}.threat{color:#d08a3a}
.x{padding:1px 8px;color:var(--warn)}
#pv{position:fixed;z-index:50;pointer-events:none;display:none}
#pv img{width:260px;height:auto;aspect-ratio:488/680;display:block;border-radius:12px;border:1px solid #e8e4d8;box-shadow:0 10px 30px rgba(0,0,0,.4);background:#222}
.rm button{margin:2px 4px 2px 0;font-size:13px;padding:3px 10px}
@media(max-width:700px){body{padding:0 10px 40px}h1{font-size:24px}.imgs img{width:200px}th,td{padding:7px 6px}}
</style>
</head>

 <p style="margin-top:14px"><span class="lbl">Composition</span><br>${ORD.filter(k=>k!=='Lands'&&G[k].length).map(k=>`<span class="chip">${k} ${G[k].length}</span>`).join('')}<span class="chip">Lands ${landsTot}</span></p>
 <p><label>Land count <select id="nl">${opts.join('')}</select></label> <span class="msn">${b.nb.length} non-basic + ${b.Bt} basics (${esc(bl)})</span></p></div>
 <div><span class="lbl">Mana curve (non-land)</span><div class="curve">${cv.map((n,i)=>`<div class="col"><span class="msn">${n}</span><div class="bar" style="height:${Math.round(n/mx*70)}px"></div><span class="msn">${i<7?i:'7+'}</span></div>`).join('')}</div></div>
 <div><span class="lbl">Mana symbols</span>${(c.ci.length?c.ci:[]).map(k=>`<p style="margin:6px 0">${sym('{'+k+'}')} <b>${pp[k]}</b> pips · ${srcs(k)} sources</p>`).join('')||'<p class="msn">Colorless deck</p>'}</div></div></div>`;
 if(b.S>0)h+=`<div class="card warnbox"><b>Heads up:</b> your collection only supplies ${b.pick.length} playable non-land cards for this strategy, so ${b.S} spell slot${b.S>1?'s were':' was'} filled with basic lands. The upgrade section below shows what to add first.</div>`;
 ORD.forEach(k=>{const g=G[k].slice().sort((a,z)=>a.o.d.cmc-z.o.d.cmc||a.o.name.localeCompare(z.o.name));if(!g.length&&!(k==='Lands'&&b.Bt))return;
  let body=g.map(p=>row(p,k==='Lands'?lchip(p.o.d,x):chips(p.a))).join('');
  if(k==='Lands')body+=Object.keys(b.bas).filter(z=>b.bas[z]).map(z=>`<tr><td>${b.bas[z]}× ${BN[z]}</td><td class="c">0</td><td><span class="chip">Basic land</span></td><td class="r">${$$(0)}</td><td></td></tr>`).join('');
  h+=`<details class="card" open><summary><h3>${k}</h3> <span class="msn">(${k==='Lands'?landsTot:g.length}) · ${$$(sum(g))}</span></summary>${tbl('<th>Card</th><th class="c">CMC</th><th>Why it\'s here</th><th class="r">Price</th><th></th>',body,COLS)}</details>`});
 if(ST.ex.size)h+=`<div class="card rm"><b>Removed from this deck (${ST.ex.size})</b> <span class="msn">every printing is excluded</span><div>${[...ST.ex].map(k=>`<button data-rs="${esc(k)}" title="Put back in the pool">↺ ${esc(OWN[k]?OWN[k].name:k)}</button>`).join('')}</div></div>`;
 h+=`<div class="card"><h3>Recommended upgrades</h3><p class="msn">The ten spots where a purchase makes the biggest difference, with budget, mid and premium swaps. Tiers: budget up to ${$$(3)}, mid up to ${$$(15)}, premium above that.</p><div id="up"></div></div>
 <div class="card"><h3>Jank corner</h3><p class="msn">Up to five unconventional, lesser-played cards that fit your strategy and could be fun in this deck.</p><div id="jk"></div></div>`;
 $('out').innerHTML=h;renderUp()}
async function renderUp(){const my=ST,k=ST.pk;let P=POOLS[k];if(!P){$('up').innerHTML='<p class="msn">Finding upgrade suggestions on Scryfall…</p>';P=await getPool(ST.x,k);if(my!==ST||my.pk!==k||!$('up'))return}
 const x=ST.x,U=ups(P,ST.deck,x),sk=new Set(),alt=c=>c?`<td data-id="${c.d.id}"><b>${esc(c.d.n)}</b> <span class="msn">${$$(c.usd)}</span><div>${c.pr==='land'?lchip(c.d,x):chips(c.a)}</div></td>`:'<td class="msn">–</td>';
 U.forEach(u=>u.T.forEach(t=>t&&sk.add(t.k)));
 $('up').innerHTML=U.length?tbl('<th class="c">#</th><th>Replace</th><th>Budget</th><th>Mid</th><th>Premium</th><th>Impact</th>',U.map((u,i)=>`<tr><td class="c">${i+1}</td><td${u.sl.id?` data-id="${u.sl.id}"`:''}><b>${esc(u.sl.n)}</b>${u.sl.cmc?` <span class="msn">(${u.sl.cmc})</span>`:''}<div>${u.sl.r==='land'?'<span class="chip tutor">Mana base</span>':chips(u.sl.a)}</div></td>${u.T.map(alt).join('')}<td>${u.imp>=4?'High':u.imp>=2.5?'Medium':'Low'}</td></tr>`).join(''),'<colgroup><col style="width:5%"><col style="width:23%"><col style="width:22%"><col style="width:22%"><col style="width:22%"><col style="width:6%"></colgroup>'):'<p class="msn">No clear upgrades found: this build is already strong for its colors.</p>';
 const J=x.th.length||x.subs.length?jank(P,ST.deck,x,sk):[];
 $('jk').innerHTML=J.length?tbl('<th>Replace</th><th>Jank pick</th>',J.map(j=>`<tr><td data-id="${j.sl.o.d.id}"><b>${esc(j.sl.o.name)}</b> <span class="msn">(${j.sl.o.d.cmc})</span><div>${chips(j.sl.a)}</div></td><td data-id="${j.c.d.id}"><b>${esc(j.c.d.n)}</b> <span class="msn">(${j.c.d.cmc}) ${$$(j.c.usd)}</span><div>${chips(j.c.a)}</div></td></tr>`).join(''),'<colgroup><col style="width:45%"><col></colgroup>'):`<p class="msn">${x.th.length||x.subs.length?'No jank candidates found for this strategy.':'Select a strategy above to get jank ideas.'}</p>`}
/* ---------- events ---------- */
async function pick(c){$('sug').hidden=true;$('q').value=c.name;$('out').innerHTML='<p class="msn">Building deck…</p>';await READY;
 let ex=new Set();try{ex=new Set(JSON.parse(localStorage.getItem('edh-x:'+lc(c.name))||'[]'))}catch(e){}
 const cc=cp(c),base=mkctx(cc);ST={c:cc,base,sel:[...base.rec],ex,lands:null};gen()}
const saveEx=()=>{try{localStorage.setItem('edh-x:'+lc(ST.c.n),JSON.stringify([...ST.ex]))}catch(e){}};
$('out').addEventListener('click',e=>{const r=e.target.closest('[data-rm]'),s=e.target.closest('[data-rs]'),t=e.target.closest('[data-th]');
 if(r){ST.ex.add(r.dataset.rm);saveEx();gen()}else if(s){ST.ex.delete(s.dataset.rs);saveEx();gen()}else if(t){const k=t.dataset.th,i=ST.sel.indexOf(k);i<0?ST.sel.push(k):ST.sel.splice(i,1);ST.lands=null;gen()}});
$('out').addEventListener('change',e=>{if(e.target.id==='nl'){ST.lands=+e.target.value;gen()}});
let sT=0;$('q').addEventListener('input',()=>{clearTimeout(sT);const v=$('q').value.trim();if(v.length<2){$('sug').hidden=true;return}sT=setTimeout(()=>search(v),280)});
async function search(v){const my=++SQ;try{const r=await fetch('https://api.scryfall.com/cards/search?order=edhrec&unique=cards&q='+encodeURIComponent(v+' is:commander game:paper'));if(my!==SQ)return;const j=r.ok?await r.json():{data:[]};SUG=(j.data||[]).slice(0,12);
 $('sug').innerHTML=SUG.length?SUG.map((c,i)=>`<button type="button" data-i="${i}"><b>${esc(c.name)}</b><span>${esc(c.type_line)}</span><span>${(c.color_identity||[]).map(k=>sym('{'+k+'}')).join('')}</span></button>`).join(''):'<div class="msn" style="padding:10px">No commanders found</div>';$('sug').hidden=false}catch(e){}}
$('sug').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)pick(SUG[+b.dataset.i])});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&SUG[0]&&!$('sug').hidden){e.preventDefault();pick(SUG[0])}});
document.addEventListener('click',e=>{if(!e.target.closest('.sbar'))$('sug').hidden=true});
const pv=$('pv'),pi=$('pi');let pid='';
const mv=e=>{const w=pv.offsetWidth||260,h=pv.offsetHeight||364;let x=e.clientX+18,y=e.clientY-h/2;if(x+w>innerWidth)x=e.clientX-w-18;pv.style.left=Math.max(4,x)+'px';pv.style.top=Math.max(8,Math.min(innerHeight-h-8,y))+'px'};
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-id]');if(!t){pv.style.display='none';pid='';return}if(t.dataset.id!==pid){pid=t.dataset.id;pi.src=art(pid)}pv.style.display='block';mv(e)});
document.addEventListener('mousemove',e=>{if(pv.style.display==='block')mv(e)});
const syncCur=()=>document.querySelectorAll('#curSeg button').forEach(b=>b.classList.toggle('on',b.dataset.cur===CUR));
$('curSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;CUR=b.dataset.cur;try{localStorage.setItem('mtg-cur',CUR)}catch(x){}syncCur();ST&&ST.deck&&render()});
syncCur();loadRate();READY=loadData().catch(e=>{$('status').textContent='Could not load card data from Scryfall: '+e.message});
</script>
